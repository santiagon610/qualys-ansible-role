---
# Download Qualys Cloud Agent via API

- name: Download | Validate API credentials
  ansible.builtin.assert:
    that:
      - qualys_api_username is defined
      - qualys_api_username | length > 0
      - qualys_api_password is defined
      - qualys_api_password | length > 0
    fail_msg: "API credentials required. Set qualys_api_username and qualys_api_password."

- name: Download | Detect platform type and architecture
  ansible.builtin.set_fact:
    qualys_platform_type: "{% if ansible_facts['system'] == 'Linux' %}{% if ansible_facts['distribution'] == 'Ubuntu' %}{% if ansible_facts['architecture'] == 's390x' %}LINUX_UBUNTU_S_390_X{% else %}LINUX_UBUNTU{% endif %}{% elif ansible_facts['distribution'] == 'CoreOS' %}LINUX_COREOS{% elif ansible_facts['distribution'] == 'Gentoo' %}GENTOO_LINUX{% elif 'Amazon' in ansible_facts['distribution'] %}LINUX_AWSBR{% elif ansible_facts['architecture'] == 'ppc64le' %}LINUX_PPC_64_LE{% elif ansible_facts['architecture'] == 's390x' %}LINUX_S_390_X{% else %}LINUX{% endif %}{% elif ansible_facts['system'] == 'Darwin' %}{% if ansible_facts['architecture'] == 'arm64' %}MACOSX_M_1{% else %}MACOSX{% endif %}{% elif ansible_facts['os_family'] == 'Windows' %}WINDOWS{% elif ansible_facts['system'] == 'AIX' %}AIX{% elif ansible_facts['system'] == 'FreeBSD' or ansible_facts['system'] == 'OpenBSD' %}BSD{% elif ansible_facts['system'] == 'SunOS' %}{% if ansible_facts['architecture'] == 'sparc' %}SOLARIS_SPARC{% else %}SOLARIS_X_86{% endif %}{% else %}LINUX{% endif %}"
    qualys_architecture: "{% if ansible_facts['architecture'] in ['x86_64', 'amd64'] %}X_86_64{% elif ansible_facts['architecture'] == 'arm64' or ansible_facts['architecture'] == 'aarch64' %}ARM_64{% elif ansible_facts['architecture'] == 'x64' %}X_64{% elif ansible_facts['architecture'] == 'ppc64le' %}PPC_64_LE{% elif ansible_facts['architecture'] == 's390x' %}S_390_X{% elif ansible_facts['architecture'] == 'sparc' %}SPARC{% elif 'power' in ansible_facts['architecture'] %}POWER_5{% else %}X_86_64{% endif %}"

- name: Download | Display detected platform
  ansible.builtin.debug:
    msg:
      - "Platform Type: {{ qualys_platform_type }}"
      - "Architecture: {{ qualys_architecture }}"

- name: Download | Create XML request body
  ansible.builtin.set_fact:
    qualys_download_xml: |
      <?xml version="1.0" encoding="UTF-8"?>
      <ServiceRequest>
        <data>
          <DownloadBinary>
            <platform>{{ qualys_platform_type }}</platform>
            <architecture>{{ qualys_architecture }}</architecture>
          </DownloadBinary>
        </data>
      </ServiceRequest>

- name: Download | Set temp directory path
  ansible.builtin.set_fact:
    qualys_temp_dir: "{% if ansible_facts['system'] == 'Linux' %}{{ qualys_agent_linux_download_path }}{% elif ansible_facts['system'] == 'Darwin' %}{{ qualys_agent_macos_download_path }}{% else %}{{ qualys_agent_windows_download_path }}{% endif %}"

- name: Download | Create temporary XML file (Linux/macOS/Unix)
  ansible.builtin.copy:
    content: "{{ qualys_download_xml }}"
    dest: "{{ qualys_temp_dir }}/download_request.xml"
    mode: '0600'
    owner: root
    group: "{{ 'wheel' if ansible_facts['system'] == 'Darwin' else 'root' }}"
  when: ansible_facts['os_family'] != 'Windows'
  become: true

- name: Download | Create temporary XML file (Windows)
  ansible.windows.win_copy:
    content: "{{ qualys_download_xml }}"
    dest: "{{ qualys_temp_dir }}\\download_request.xml"
  when: ansible_facts['os_family'] == 'Windows'

- name: Download | Set download path based on OS
  ansible.builtin.set_fact:
    qualys_download_path: "{% if ansible_facts['system'] == 'Linux' %}{{ qualys_agent_linux_download_path }}/{{ qualys_agent_linux_package_name }}{% elif ansible_facts['system'] == 'Darwin' %}{{ qualys_agent_macos_download_path }}/{{ qualys_agent_macos_package_name }}{% elif ansible_facts['os_family'] == 'Windows' %}{{ qualys_agent_windows_download_path }}\\{{ qualys_agent_windows_installer_name }}{% endif %}"

- name: Download | Fetch agent from Qualys API (Linux/macOS/Unix)
  ansible.builtin.uri:
    url: "{{ qualys_api_url }}/qps/rest/1.0/download/ca/downloadbinary/"
    method: POST
    user: "{{ qualys_api_username }}"
    password: "{{ qualys_api_password }}"
    force_basic_auth: true
    body: "{{ qualys_download_xml }}"
    headers:
      Content-Type: "text/xml"
      X-Requested-With: "curl"
    dest: "{{ qualys_download_path }}"
    mode: '0600'
    status_code: 200
    timeout: "{{ qualys_agent_request_timeout }}"
    validate_certs: true
  register: qualys_download_result
  retries: "{{ qualys_agent_retry_count }}"
  delay: "{{ qualys_agent_retry_delay }}"
  until: qualys_download_result is succeeded
  when: ansible_facts['os_family'] != 'Windows'
  # no_log: true
  become: true

- name: Download | Fetch agent from Qualys API (Windows)
  ansible.windows.win_uri:
    url: "{{ qualys_api_url }}/qps/rest/1.0/download/ca/downloadbinary/"
    method: POST
    url_username: "{{ qualys_api_username }}"
    url_password: "{{ qualys_api_password }}"
    force_basic_auth: true
    body: "{{ qualys_download_xml }}"
    headers:
      Content-Type: "text/xml"
      X-Requested-With: "curl"
    dest: "{{ qualys_download_path }}"
    status_code: 200
    timeout: "{{ qualys_agent_request_timeout }}"
    validate_certs: true
  register: qualys_download_result_windows
  retries: "{{ qualys_agent_retry_count }}"
  delay: "{{ qualys_agent_retry_delay }}"
  until: qualys_download_result_windows is succeeded
  when: ansible_facts['os_family'] == 'Windows'
  # no_log: true

- name: Download | Cleanup XML request file (Linux/macOS/Unix)
  ansible.builtin.file:
    path: "{{ qualys_temp_dir }}/download_request.xml"
    state: absent
  when: ansible_facts['os_family'] != 'Windows'
  become: true
  ignore_errors: true

- name: Download | Cleanup XML request file (Windows)
  ansible.windows.win_file:
    path: "{{ qualys_temp_dir }}\\download_request.xml"
    state: absent
  when: ansible_facts['os_family'] == 'Windows'
  ignore_errors: true

# Security: Verify download succeeded
- name: Download | Verify agent package was downloaded successfully
  ansible.builtin.assert:
    that:
      - (qualys_download_result is defined and qualys_download_result is succeeded) or
        (qualys_download_result_windows is defined and qualys_download_result_windows is succeeded)
    fail_msg: "Failed to download Qualys agent package from API"
    success_msg: "Agent package downloaded successfully"
  tags:
    - download
