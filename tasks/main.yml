---
# Security: Validate required variables exist
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - qualys_activation_id is defined
      - qualys_activation_id | length > 0
      - qualys_customer_id is defined
      - qualys_customer_id | length > 0
      - qualys_cloud_platform is defined
      - qualys_cloud_platform | length > 0
      - qualys_api_username is defined
      - qualys_api_username | length > 0
      - qualys_api_password is defined
      - qualys_api_password | length > 0
    fail_msg: "Required variables not set. Define: qualys_activation_id, qualys_customer_id, qualys_cloud_platform, qualys_api_username, qualys_api_password"
    success_msg: "Required credentials validated."
  # no_log: true
  tags:
    - always
    - preflight

# Security: Validate URL format to prevent SSRF and injection
- name: Validate cloud platform URL format
  ansible.builtin.assert:
    that:
      - qualys_cloud_platform is regex('^https://[a-zA-Z0-9][a-zA-Z0-9.-]+\\.qualys\\.(com|eu|in|ca|uk|au)')
    fail_msg: "qualys_cloud_platform must be a valid Qualys HTTPS URL (e.g., https://qagpublic.qg1.apps.qualys.com)"
    success_msg: "Cloud platform URL validated."
  tags:
    - always
    - preflight

# Security: Validate IDs contain only safe characters (alphanumeric, hyphens, underscores)
- name: Validate activation and customer IDs format
  ansible.builtin.assert:
    that:
      - qualys_activation_id is regex('^[a-zA-Z0-9_-]+$')
      - qualys_customer_id is regex('^[a-zA-Z0-9_-]+$')
    fail_msg: "qualys_activation_id and qualys_customer_id must contain only alphanumeric characters, hyphens, and underscores"
    success_msg: "Credential format validated."
  # no_log: true
  tags:
    - always
    - preflight

# Security: Validate proxy URL if specified
- name: Validate proxy URL format if specified
  ansible.builtin.assert:
    that:
      - qualys_agent_proxy_url is regex('^https?://[a-zA-Z0-9][a-zA-Z0-9._:-]+$') or qualys_agent_proxy_url | length == 0
    fail_msg: "qualys_agent_proxy_url must be a valid HTTP/HTTPS URL if specified"
    success_msg: "Proxy URL validated."
  when: qualys_agent_proxy_url is defined
  tags:
    - always
    - preflight

- name: Display installation details
  ansible.builtin.debug:
    msg:
      - "OS: {{ ansible_facts['os_family'] }} {{ ansible_facts['distribution'] | default(ansible_facts['system']) }}"
      - "Version: {{ ansible_facts['distribution_version'] | default('N/A') }}"
      - "Architecture: {{ ansible_facts['architecture'] }}"
      - "Platform: {{ qualys_cloud_platform }}"
      - "State: {{ qualys_agent_state }}"
  tags:
    - always
    - preflight

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - "default.yml"
      paths:
        - "vars"
  tags:
    - always

- name: Include Linux installation tasks
  ansible.builtin.include_tasks: install_linux.yml
  when:
    - ansible_facts['system'] == "Linux"
  tags:
    - linux
    - install

- name: Include macOS installation tasks
  ansible.builtin.include_tasks: install_macos.yml
  when:
    - ansible_facts['system'] == "Darwin"
  tags:
    - macos
    - install

- name: Include Windows installation tasks
  ansible.builtin.include_tasks: install_windows.yml
  when:
    - ansible_facts['os_family'] == "Windows"
  tags:
    - windows
    - install

- name: Include service management tasks
  ansible.builtin.include_tasks: service.yml
  when:
    - qualys_agent_state != "absent"
  tags:
    - service
    - configure

- name: Include validation tasks
  ansible.builtin.include_tasks: validate.yml
  when:
    - qualys_agent_validate_install | bool
    - qualys_agent_state != "absent"
  tags:
    - validate
    - verify
