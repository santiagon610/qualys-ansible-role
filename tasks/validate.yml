---
# Validation tasks for Qualys Cloud Agent installation

- name: Validate | Include Linux validation
  ansible.builtin.include_tasks: validate_linux.yml
  when: ansible_facts['system'] == "Linux"

- name: Validate | Include macOS validation
  ansible.builtin.include_tasks: validate_macos.yml
  when: ansible_facts['system'] == "Darwin"

- name: Validate | Include Windows validation
  ansible.builtin.include_tasks: validate_windows.yml
  when: ansible_facts['os_family'] == "Windows"

# Common Validation Tasks
- name: Validate | Final validation summary
  ansible.builtin.debug:
    msg:
      - "=== Qualys Cloud Agent Validation Summary ==="
      - "Platform: {{ qualys_cloud_platform }}"
      - "Installation: SUCCESSFUL"
      - "Service: {{ qualys_agent_service_state | upper }}"
      - "Startup: {{ 'ENABLED' if qualys_agent_service_enabled else 'DISABLED' }}"
      - "Next Steps:"
      - "  1. Verify agent appears in Qualys portal within 5-10 minutes"
      - "  2. Confirm asset tags and metadata"
      - "  3. Validate vulnerability scanning is active"

- name: Validate | Important notes
  ansible.builtin.debug:
    msg:
      - "NOTE: It may take 5-10 minutes for the agent to appear in Qualys portal"
      - "Check logs for activation status:"
      - "  Linux: {{ qualys_agent_log_path_linux }}/qualys-cloud-agent.log"
      - "  macOS: /Library/Application Support/Qualys/QualysCloudAgent/qualys-cloud-agent.log"
      - "  Windows: {{ qualys_agent_log_path_windows }}\\qualys-cloud-agent.log"
